<!DOCTYPE html>
<html>
<head>
    <title>Add Transaction</title>
</head>
<body>

<h1>Add Transaction</h1>

<form method="POST">

    <input
        type="text"
        name="title"
        placeholder="Title"
        required
    >

    <br><br>

    <input
        type="number"
        step="0.01"
        name="amount"
        placeholder="Amount"
        required
    >

    <br><br>

    <input
        type="text"
        name="category"
        placeholder="Category"
        required
    >

    <br><br>

    <select name="transaction_type">

        <option value="income">
            Income
        </option>

        <option value="expense">
            Expense
        </option>

    </select>

    <br><br>

    <button type="submit">
        Save
    </button>

</form>

</body>
</html>
